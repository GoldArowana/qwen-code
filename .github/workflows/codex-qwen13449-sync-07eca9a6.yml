name: Validate Qwen13449 main sync 07eca9a6
on:
  push:
    branches:
      - codex-ci/qwen13449-sync-07eca9a6
permissions:
  contents: read
jobs:
  check:
    name: Exact source validation
    runs-on: ubuntu-26.04
    timeout-minutes: 145
    strategy:
      fail-fast: false
      matrix:
        scope: [targeted, canonical]
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      WORKFLOW_SIZE_BASE_SHA: 56ea1bc3fbb794bd42e62c532c7962164e7f3786
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Record standard runtime
        run: |
          node --version
          npm --version
          corepack enable
          case "$RUNNER_NAME" in ecs-qwen-*) exit 1;; esac
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: GoldArowana/qwen-code
          ref: 'e52584e96f733d2fabdf09f2b62d542de0ef313d'
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Assert source commit, tree and merge parents
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 'e52584e96f733d2fabdf09f2b62d542de0ef313d'
          test "$(git rev-parse HEAD^{tree})" = 'e5f54b2fb9152ea8f2f5211cd1ac8f19705b33f6'
          parents=$(git cat-file -p HEAD | sed -n '/^$/q; s/^parent //p' | paste -sd ' ' -)
          test "$parents" = '4a56a936d5c95d9419969b70c61f1744ef4d5f4c 56ea1bc3fbb794bd42e62c532c7962164e7f3786'
          git remote get-url origin | grep -Fx 'https://github.com/GoldArowana/qwen-code'
          git diff HEAD --exit-code
          git show -s --format='SOURCE_BINDING commit=%H tree=%T'
          printf 'SOURCE_PARENTS %s\n' "$parents"
      - name: Bootstrap exact frozen dependencies and workspace prerequisites
        working-directory: source
        run: |
          corepack pnpm install --frozen-lockfile --reporter=append-only
          git diff HEAD --exit-code
      - name: Run affected Shell and background fixtures
        if: matrix.scope == 'targeted'
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        working-directory: source/packages/cli
        timeout-minutes: 15
        run: |
          corepack pnpm exec vitest run \
            src/ui/hooks/shellCommandProcessor.test.ts \
            src/ui/hooks/use-llm-stream.test.tsx \
            src/ui/components/background-view/BackgroundTasksDialog.test.tsx
          git diff HEAD --exit-code
          echo QWEN13449_EXACT_TARGETED_PASSED
      - name: Run unchanged upstream preflight
        if: matrix.scope == 'canonical'
        working-directory: source
        timeout-minutes: 125
        run: |
          npm run preflight
          echo QWEN13449_EXACT_PREFLIGHT_PASSED
      - name: Always assert exact source and tracked worktree cleanliness
        if: always()
        run: |
          test -d source/.git
          cd source
          test "$(git rev-parse HEAD)" = 'e52584e96f733d2fabdf09f2b62d542de0ef313d'
          test "$(git rev-parse HEAD^{tree})" = 'e5f54b2fb9152ea8f2f5211cd1ac8f19705b33f6'
          git diff HEAD --exit-code
          echo QWEN13449_EXACT_TRACKED_SOURCE_UNCHANGED
