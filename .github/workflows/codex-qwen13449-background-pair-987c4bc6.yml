name: Diagnose Qwen13449 background dialog 987c4bc6
on:
  push:
    branches:
      - 'codex-ci/qwen13449-background-pair-987c4bc6'
permissions:
  contents: read
jobs:
  observe:
    name: Background dialog observations (${{ matrix.role }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: main88
            source: '88e509480059c699ef0d85c7963690eda17ce9b3'
            tree: '88e509480059c699ef0d85c7963690eda17ce9b3'
          - role: candidate428
            source: '42835a115ca86485e5115fcd51460bb8157f7cf7'
            tree: '97bf4741b522ad2a7bf8d614fb96146384c0c4bf'
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Record matching standard runtime
        run: |
          node --version
          npm --version
          corepack enable
          node -e 'console.log(JSON.stringify({platform:process.platform,arch:process.arch,parallelism:require("os").availableParallelism()}))'
          case "$RUNNER_NAME" in ecs-qwen-*) exit 1;; esac
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: GoldArowana/qwen-code
          ref: '${{ matrix.source }}'
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact observed snapshot
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = '${{ matrix.source }}'
          test "$(git rev-parse HEAD^{tree})" = '${{ matrix.tree }}'
          git show -s --format='OBSERVED source=%H tree=%T parents=%P'
          git diff HEAD --exit-code
      - name: Normal frozen bootstrap and workspace prerequisites
        working-directory: source
        run: |
          corepack pnpm install --frozen-lockfile --reporter=append-only
          git diff HEAD --exit-code
          echo BOOTSTRAP_SOURCE_UNCHANGED
      - name: Five unmodified complete-file observations
        working-directory: source/packages/cli
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          mkdir -p /tmp/qwen-background-results
          any_failure=0
          for attempt in 1 2 3 4 5; do
            echo "OBSERVATION_START role=${{ matrix.role }} attempt=$attempt"
            set +e
            corepack pnpm exec vitest run src/ui/components/background-view/BackgroundTasksDialog.test.tsx --reporter=default --reporter=json --outputFile="/tmp/qwen-background-results/${{ matrix.role }}-$attempt.json"
            result=$?
            set -e
            echo "$result" > "/tmp/qwen-background-results/${{ matrix.role }}-$attempt.exit"
            test -f "/tmp/qwen-background-results/${{ matrix.role }}-$attempt.json"
            git diff HEAD --exit-code
            echo "OBSERVATION_END role=${{ matrix.role }} attempt=$attempt actual_exit=$result"
            if test "$result" -ne 0; then any_failure=1; fi
          done
          test "$any_failure" -eq 0
      - name: Preserve all actual observations including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qwen-background-${{ matrix.role }}-observations
          path: /tmp/qwen-background-results/*
          if-no-files-found: error
          retention-days: 14
      - name: Always prove unchanged observed source
        if: always()
        run: |
          test -d source/.git
          cd source
          test "$(git rev-parse HEAD)" = '${{ matrix.source }}'
          test "$(git rev-parse HEAD^{tree})" = '${{ matrix.tree }}'
          git diff HEAD --exit-code
          echo OBSERVATION_SOURCE_UNCHANGED
