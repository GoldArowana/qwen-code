name: Compare Shell Content boundary on base and PR head
on:
  push:
    branches:
      - codex-ci/qwen13449-c6-20261104-f6264282
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: GoldArowana/qwen-code
          ref: 0f2c7d7d8a0830092a710e6cfc4cf247757265d8
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Preserve immutable probe and source identities
        env:
          CI_EVENT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "0f2c7d7d8a0830092a710e6cfc4cf247757265d8"
          git fetch --no-tags --depth=1 origin 35aa4b76ae10a458632d23c9b0052af5a31b3885
          git fetch --no-tags --depth=1 origin "$CI_EVENT_SHA"
          mkdir -p "$RUNNER_TEMP/qwen-c6-results"
          git show "$CI_EVENT_SHA:.github/codex-c6/compare.py" > "$RUNNER_TEMP/qwen-c6-compare.py"
          git show "$CI_EVENT_SHA:.github/codex-c6/probe.patch" > "$RUNNER_TEMP/qwen-c6-probe.patch"
          git show HEAD:packages/cli/src/ui/hooks/use-llm-stream.test.tsx > "$RUNNER_TEMP/qwen-c6-fixture.tsx"
      - name: Install pinned dependencies once
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Build and compare exact base and head with one fixture
        run: python3 "$RUNNER_TEMP/qwen-c6-compare.py"
      - name: Print retained results even on build or collection failure
        if: always()
        run: |
          for label in base head; do
            if test -f "$RUNNER_TEMP/qwen-c6-results/$label-summary.json"; then cat "$RUNNER_TEMP/qwen-c6-results/$label-summary.json"; fi
            if test -f "$RUNNER_TEMP/qwen-c6-results/$label-test.log"; then tail -n 100 "$RUNNER_TEMP/qwen-c6-results/$label-test.log"; fi
          done
          if test -f "$RUNNER_TEMP/qwen-c6-results/COMPARISON.json"; then cat "$RUNNER_TEMP/qwen-c6-results/COMPARISON.json"; fi
