name: Qwen 13449 balanced failure capture c88cb3b7
on:
  push:
    branches:
      - codex-ci/qwen13449-pair-c88cb3b7
permissions:
  contents: read
jobs:
  pair:
    if: github.repository == 'GoldArowana/qwen-code'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      BASE_SHA: 55ee16ec23727a20767e2f4a768bf4ff278793a3
      BASE_TREE: bd24bf19e42136a41e70c02148e689ab66bd608d
      CANDIDATE_SHA: 04453f2fcb05f2b05492d2d2f9fe08901991d7b6
      AUTHOR_SHA: cf5a83fdeb56306455b1cac55d595600da2386a4
      CANDIDATE_TREE: 1b58d30b4d76ae63dd1c6f23aa4e17b61e752c6b
      TEST_NAME: 'keeps a tracked legacy .qwen/.gitignore instead of migrating it'
      FIXTURE_PATH: src/services/gitWorktreeService.dirty-carry.integ.test.ts
      TEST_PATTERN: 'keeps a tracked legacy \.qwen/\.gitignore instead of migrating it$'
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: QwenLM/qwen-code
          ref: 04453f2fcb05f2b05492d2d2f9fe08901991d7b6
          path: paired-source
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source pair and install frozen dependencies
        id: bootstrap
        working-directory: paired-source
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(node --version)" = v22.23.4
          git --version
          printf 'RUNNER image_os=%s image_version=%s runner_os=%s runner_arch=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}" "$RUNNER_OS" "$RUNNER_ARCH"
          printf 'OUTPUT_SCOPE main_parent=%s merge_candidate=%s\n' "$BASE_SHA" "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git rev-parse 'HEAD^1')" = "$BASE_SHA"
          test "$(git rev-parse 'HEAD^2')" = "$AUTHOR_SHA"
          test "$(git rev-parse "${BASE_SHA}^{tree}")" = "$BASE_TREE"
          test "$(git remote get-url origin)" = 'https://github.com/QwenLM/qwen-code'
          python3 - "$BASE_SHA" "$CANDIDATE_SHA" <<'PYTHON'
          import subprocess
          import sys

          actual = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", *sys.argv[1:]]
          ).decode().split("\0")
          expected = [
              "",
              "docs/users/features/commands.md",
              "packages/cli/src/ui/hooks/shellCommandProcessor.test.ts",
              "packages/cli/src/ui/hooks/shellCommandProcessor.ts",
              "packages/cli/src/ui/hooks/use-llm-stream.test.tsx",
              "packages/cli/src/ui/hooks/use-llm-stream.ts",
          ]
          assert sorted(actual) == expected, actual
          PYTHON
          corepack enable
          test "$(corepack pnpm --version)" = 11.24.0
          corepack pnpm install --frozen-lockfile --reporter=append-only
          # Root prepare runs the standard build during frozen installation.
          (cd packages/core && node --input-type=module -e 'import {checkAndReport} from "../../scripts/vitest-global-setup.js"; process.exitCode = checkAndReport()')
          git diff --exit-code
          git diff --cached --exit-code
      - name: Run the balanced Core fixture and capture first errors
        timeout-minutes: 8
        working-directory: paired-source
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          base = os.environ["BASE_SHA"]
          candidate = os.environ["CANDIDATE_SHA"]
          trees = {base: os.environ["BASE_TREE"], candidate: os.environ["CANDIDATE_TREE"]}
          test_name = os.environ["TEST_NAME"]
          test_pattern = os.environ["TEST_PATTERN"]
          core = Path("packages/core").resolve()
          fixture = core / os.environ["FIXTURE_PATH"]
          diagnostic = fixture.with_name("gitWorktreeService.dirty-carry.first-failure.integ.test.ts")
          assertion = b"    expect(result.success).toBe(true);\n    return result.worktree!;"
          capture = (
              b"    if (!result.success) {\n"
              b"      console.error('QWEN_RESULT_ERROR', JSON.stringify(result.error ?? null));\n"
              b"    }\n"
          )
          initial_fixture = fixture.read_bytes()
          assert initial_fixture.count(assertion) == 1


          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()


          def assert_source(revision):
              assert git("rev-parse", "HEAD") == revision
              assert git("rev-parse", "HEAD^{tree}") == trees[revision]
              assert not git("diff", "HEAD", "--exit-code")
              assert not diagnostic.exists()
              assert fixture.read_bytes() == initial_fixture


          def run_one(revision, mode, index):
              git("switch", "--detach", revision)
              assert_source(revision)
              selected = fixture
              if mode == "instrumented":
                  with diagnostic.open("xb") as handle:
                      handle.write(initial_fixture.replace(assertion, capture + assertion))
                  selected = diagnostic

              report = Path(os.environ["RUNNER_TEMP"]) / f"qwen-balanced-{index}.json"
              print("QWEN_BALANCED_START", json.dumps({
                  "index": index, "mode": mode, "source": revision,
                  "tree": trees[revision], "path": selected.name,
              }), flush=True)
              started = time.monotonic()
              try:
                  process = subprocess.run([
                      "corepack", "pnpm", "exec", "vitest", "run",
                      str(selected.relative_to(core)), "--testNamePattern", test_pattern,
                      "--reporter=verbose", "--reporter=json", f"--outputFile={report}",
                  ], cwd=core, timeout=120, check=False)
                  files = json.loads(report.read_text())["testResults"]
                  assert len(files) == 1 and files[0]["name"].endswith("/" + selected.name), files
                  executed = [test for test in files[0]["assertionResults"] if test["status"] in ("passed", "failed")]
                  assert len(executed) == 1 and executed[0]["title"] == test_name, executed
                  result = executed[0]["status"]
                  assert (result == "passed") == (process.returncode == 0), (result, process.returncode)
                  print("QWEN_BALANCED_RESULT", json.dumps({
                      "index": index, "mode": mode, "source": revision, "tests_run": 1,
                      "status": result, "exit": process.returncode,
                      "elapsed_seconds": round(time.monotonic() - started, 3),
                  }), flush=True)
                  return result
              finally:
                  if mode == "instrumented":
                      diagnostic.unlink()
                  assert_source(revision)


          # Four counterbalanced pairs preserve a failure from the first invocation.
          # Two original-file controls keep the changed fixture path visible.
          sequence = [
              ("instrumented", base), ("instrumented", candidate),
              ("instrumented", candidate), ("instrumented", base),
              ("instrumented", candidate), ("instrumented", base),
              ("instrumented", base), ("instrumented", candidate),
              ("original", candidate), ("original", base),
          ]
          failures = []
          try:
              for index, (mode, revision) in enumerate(sequence, 1):
                  if run_one(revision, mode, index) == "failed":
                      failures.append({"index": index, "mode": mode, "source": revision})
          finally:
              git("switch", "--detach", candidate)
              assert_source(candidate)
          print("QWEN_BALANCED_COMPLETE", json.dumps({
              "runs": len(sequence), "failures": failures, "candidate_clean": True,
          }), flush=True)
          raise SystemExit(1 if failures else 0)
          PYTHON
      - name: Verify exact and clean sources after execution
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        working-directory: paired-source
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          git diff --exit-code
          git diff --cached --exit-code
