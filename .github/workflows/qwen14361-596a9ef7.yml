name: Qwen managed Shell receipts 596a9ef7
on:
  push:
    branches: ['codex-ci/qwen14361-596a9ef7']
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.repository == 'GoldArowana/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REPO: QwenLM/qwen-code
      SOURCE_SHA: acc07c2eb0f55d71e6402c5ebec33476c6268c90
      SOURCE_TREE: c66c93a507dfb9cdab5a3088bea6906dfc434046
      MYSQL_PASSWORD: hosted-fixture
      FIXTURE: packages/managed-agent-server/verification/src/test/java/com/alibaba/qwen/code/managedagent/persistence/ToolPublicationAsyncVerificationTest.java
      METHODS: asyncSegmentReceiptNamesTheOriginalCaptureStreamAndOrdinal+seededLegacySucceededReceiptSurvivesReplacementAndOriginalReplay+durableContentKeepsResourceReceiptAndExactReplay+sealAndPageKeepTheirOwnReceiptShapes+historicalReplayDoesNotReadAndAnotherIdForTheSameSlotCompletesDirectly
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: hosted_harness_test
          MYSQL_ROOT_PASSWORD: hosted-fixture
          MYSQL_ROOT_HOST: '%'
        ports: ['3306/tcp']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -phosted-fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Read event fixtures
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: harness
          ref: '${{ github.sha }}'
          sparse-checkout: .github/diagnostics/qwen14361-596a9ef7
          persist-credentials: false
      - name: Read exact upstream source
        id: source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: '${{ env.SOURCE_REPO }}'
          ref: '${{ env.SOURCE_SHA }}'
          path: source
          persist-credentials: false
      - name: Assert source identity and clean tracked bytes
        working-directory: source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test "$(git remote get-url origin)" = "https://github.com/$SOURCE_REPO"
          git diff HEAD --exit-code
          printf 'Source %s %s %s; event %s\n' "$SOURCE_REPO" "$SOURCE_SHA" "$SOURCE_TREE" "$GITHUB_SHA"
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '21'
          settings-path: '${{ runner.temp }}/m2-settings'
      - name: Bootstrap exact sibling Java SDK
        id: sdk
        working-directory: source
        run: |
          set -euo pipefail
          java -version
          mvn --version
          echo "MAVEN_ARGS=--settings $RUNNER_TEMP/m2-settings/settings.xml --toolchains $RUNNER_TEMP/m2-settings/toolchains.xml -Dmaven.repo.local=$RUNNER_TEMP/m2-repo" >> "$GITHUB_ENV"
          mvn --settings "$RUNNER_TEMP/m2-settings/settings.xml" --toolchains "$RUNNER_TEMP/m2-settings/toolchains.xml" \
            "-Dmaven.repo.local=$RUNNER_TEMP/m2-repo" --batch-mode --no-transfer-progress \
            -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install
          git diff HEAD --exit-code
      - name: Verify disposable MySQL version and schema permissions
        id: mysql
        env:
          MYSQL_PWD: '${{ env.MYSQL_PASSWORD }}'
        run: |
          set -euo pipefail
          mysql_container='${{ job.services.mysql.id }}'
          version="$(docker exec -e MYSQL_PWD "$mysql_container" mysql -uroot -NB -e 'SELECT VERSION()')"
          [[ "$version" = 8.4.6* ]]
          docker exec -e MYSQL_PWD "$mysql_container" mysql -uroot -e 'CREATE DATABASE qwen_receipt_probe; DROP DATABASE qwen_receipt_probe;'
          printf 'MySQL %s; isolated fixture schema permissions verified\n' "$version"
      - name: Apply the separately recorded test-only fixture
        id: fixture
        working-directory: source
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/harness/.github/diagnostics/qwen14361-596a9ef7/receipt-probes.patch"
          sha256sum "$patch"
          test "$(git hash-object "$FIXTURE")" = 25cc18df5f78ac51d44c29389dd891b53c0882e0
          git diff HEAD --exit-code
          git apply --check "$patch"
          git apply "$patch"
          test "$(git diff HEAD --name-only)" = "$FIXTURE"
          git diff --check
      - name: Observe H2 receipts and controls
        working-directory: source/packages/managed-agent-server
        run: mvn --batch-mode --no-transfer-progress "-Dtest=ToolPublicationAsyncVerificationTest#$METHODS" test
      - name: Preserve the original H2 report
        if: "!cancelled() && steps.fixture.outcome == 'success'"
        run: |
          mkdir -p "$RUNNER_TEMP/qwen-h2"
          find source/packages/managed-agent-server/verification/target/surefire-reports -maxdepth 1 \
            -name 'TEST-*.ToolPublicationAsyncVerificationTest.xml' -exec cp -t "$RUNNER_TEMP/qwen-h2" -- {} +
      - name: Observe MySQL receipts and controls
        if: "!cancelled() && steps.fixture.outcome == 'success' && steps.mysql.outcome == 'success'"
        working-directory: source/packages/managed-agent-server
        env:
          MYSQL_PORT: '${{ job.services.mysql.ports[3306] }}'
        run: |
          mvn --batch-mode --no-transfer-progress -Pmysql-integration \
            '-Dtest=ToolPublicationAsyncVerificationTest#historicalReplayDoesNotReadAndAnotherIdForTheSameSlotCompletesDirectly' \
            "-Dit.test=ToolPublicationAsyncVerificationMySqlIT#$METHODS" \
            "-Dmysql.url=jdbc:mysql://127.0.0.1:$MYSQL_PORT/hosted_harness_test?allowPublicKeyRetrieval=true&useSSL=false" \
            -Dmysql.user=root "-Dmysql.password=$MYSQL_PASSWORD" verify
      - name: Restore exact source before the Hosted control
        id: restore
        if: "always() && steps.source.outcome == 'success'"
        working-directory: source
        run: |
          set -euo pipefail
          if ! git diff HEAD --exit-code -- "$FIXTURE"; then
            patch="$GITHUB_WORKSPACE/harness/.github/diagnostics/qwen14361-596a9ef7/receipt-probes.patch"
            test "$(git diff HEAD --name-only)" = "$FIXTURE"
            git apply --check --reverse "$patch"
            git apply --reverse "$patch"
          fi
          git diff HEAD --exit-code
          test "$(git hash-object "$FIXTURE")" = 25cc18df5f78ac51d44c29389dd891b53c0882e0
      - name: Set up Node 22 for Hosted
        id: node
        if: "!cancelled() && steps.restore.outcome == 'success' && steps.sdk.outcome == 'success' && steps.mysql.outcome == 'success'"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Bootstrap the exact frozen CLI
        id: cli
        if: "!cancelled() && steps.node.outcome == 'success'"
        working-directory: source
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          test -s dist/cli.js
          git diff HEAD --exit-code
      - name: Observe real Hosted Shell recovery with its local model fixture
        if: "!cancelled() && steps.cli.outcome == 'success'"
        working-directory: source/packages/managed-agent-server
        env:
          MYSQL_PORT: '${{ job.services.mysql.ports[3306] }}'
        run: |
          mvn --batch-mode --no-transfer-progress -Phosted-harness-mysql \
            -Dit.test=HostedShellLifecycleRecoveryIT \
            "-Dnode.executable=$(command -v node)" "-Dqwen.cli.entry=$GITHUB_WORKSPACE/source/dist/cli.js" \
            "-Dmysql.url=jdbc:mysql://127.0.0.1:$MYSQL_PORT/hosted_harness_test?allowPublicKeyRetrieval=true&useSSL=false" \
            -Dmysql.user=root "-Dmysql.password=$MYSQL_PASSWORD" verify
      - name: Report observed cases and verify source identity
        if: "always() && steps.source.outcome == 'success'"
        working-directory: source
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/harness/.github/diagnostics/qwen14361-596a9ef7/report.py"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff HEAD --exit-code
