name: Validate official Node22 shell merge candidate
on:
  push:
    branches:
      - 'codex-ci/qwen13449-node22-20261105-c9d81e4'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      WORKFLOW_SIZE_BASE_SHA: ef9c891b8f977f7461c8f1f63622507dfdfec953
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: Record official runtime
        run: |
          node --version
          npm --version
          corepack enable
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: GoldArowana/qwen-code
          ref: ed6760aa2c30b1d48c368822b7cd061e7e2711b7
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Official Node22 old baseline ACP control
        working-directory: control
        run: |
          test "$(git rev-parse HEAD)" = ed6760aa2c30b1d48c368822b7cd061e7e2711b7
          git show -s --format='CONTROL_BASE source=%H tree=%T'
          corepack pnpm install --frozen-lockfile --reporter=append-only
          sha256sum pnpm-lock.yaml packages/cli/src/acp-integration/acp-output.ts packages/cli/src/acp-integration/acp-output.test.ts
          set +e
          result=0
          for attempt in 1 2 3; do
            (cd packages/cli && corepack pnpm exec vitest run src/acp-integration/acp-output.test.ts --maxWorkers=1 --no-file-parallelism --reporter=verbose)
            code=$?
            echo "NODE22_BASE_ACP repetition=$attempt exit=$code"
            if [ "$code" -ne 0 ]; then result=1; fi
          done
          printf '%s\n' "$result" > "$RUNNER_TEMP/qwen-node22-base-exit"
          git diff --exit-code
      - name: Official Node22 released old candidate ACP control
        working-directory: control
        run: |
          git fetch --depth=1 origin 73dc06fea16ce4e0636de3f597bcc8d4cfcddcf2
          git diff --exit-code HEAD FETCH_HEAD -- package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .pnpmfile.mjs scripts/patch-ink.js
          git checkout --detach 73dc06fea16ce4e0636de3f597bcc8d4cfcddcf2
          test "$(git rev-parse HEAD)" = 73dc06fea16ce4e0636de3f597bcc8d4cfcddcf2
          git show -s --format='CONTROL_OLD_HEAD source=%H tree=%T'
          npm run build --workspace=packages/cli
          sha256sum pnpm-lock.yaml packages/cli/src/acp-integration/acp-output.ts packages/cli/src/acp-integration/acp-output.test.ts
          set +e
          result=0
          for attempt in 1 2 3; do
            (cd packages/cli && corepack pnpm exec vitest run src/acp-integration/acp-output.test.ts --maxWorkers=1 --no-file-parallelism --reporter=verbose)
            code=$?
            echo "NODE22_OLD_HEAD_ACP repetition=$attempt exit=$code"
            if [ "$code" -ne 0 ]; then result=1; fi
          done
          printf '%s\n' "$result" > "$RUNNER_TEMP/qwen-node22-old-head-exit"
          git diff --exit-code
      - name: Require actual new-condition control success
        run: |
          test "$(cat "$RUNNER_TEMP/qwen-node22-base-exit")" = 0
          test "$(cat "$RUNNER_TEMP/qwen-node22-old-head-exit")" = 0
          echo NODE22_OLD_SOURCE_COUNTERCONTROL_PASSED
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: GoldArowana/qwen-code
          ref: 'c9d81e46f2d793da5552e5142f2d523de1381b20'
          path: candidate
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact candidate source
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = 'c9d81e46f2d793da5552e5142f2d523de1381b20'
          test "$(git rev-parse HEAD^{tree})" = 'fe3dd7c0dc5a628830b4b432a5eec5ec67d1c971'
          git show -s --format='CANDIDATE source=%H tree=%T parents=%P'
          node --version
      - name: Strict actual canonical lint-gate containment
        working-directory: candidate
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { GATE_FILES, findStaleGateFiles } from './.github/scripts/check-lint-gate-freshness.mjs';
          const head = 'c9d81e46f2d793da5552e5142f2d523de1381b20';
          const fetchJson = async path => {
            const endpoint = path.startsWith('/repos/QwenLM/qwen-code/compare/')
              ? path.replace('/repos/QwenLM/qwen-code/compare/', '/repos/GoldArowana/qwen-code/compare/') : path;
            const value = JSON.parse(execFileSync('gh', ['api', endpoint.slice(1)], {encoding:'utf8',maxBuffer:16*1024*1024}));
            if (path.includes('/commits?')) console.log('GATE_CANONICAL', JSON.stringify({path,sha:value[0]?.sha}));
            else console.log('GATE_CONTAINMENT', JSON.stringify({path,status:value.status,merge_base:value.merge_base_commit?.sha}));
            return value;
          };
          const stale = await findStaleGateFiles({fetchJson,repo:'QwenLM/qwen-code',baseRef:'main',headSha:head});
          if (stale.length) throw new Error('Actual canonical gate stale: '+JSON.stringify(stale));
          console.log('STRICT_CANONICAL_GATE_PASS', JSON.stringify({head,files:GATE_FILES.length}));
          JS
      - name: Actual unchanged canonical full preflight
        working-directory: candidate
        timeout-minutes: 90
        run: |
          echo CANONICAL_PREFLIGHT_START
          npm run preflight
          echo CANONICAL_PREFLIGHT_PASSED
      - name: Prove preflight did not alter candidate source
        if: always()
        run: |
          if [ -d candidate/.git ]; then
            cd candidate
            test "$(git rev-parse HEAD)" = 'c9d81e46f2d793da5552e5142f2d523de1381b20'
            test "$(git rev-parse HEAD^{tree})" = 'fe3dd7c0dc5a628830b4b432a5eec5ec67d1c971'
            git diff HEAD --exit-code
            echo CANDIDATE_SOURCE_UNCHANGED
          fi
