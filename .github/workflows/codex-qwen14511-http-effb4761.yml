name: Codex Qwen14511 HTTP effb4761
on:
  push:
    branches: [codex-ci/qwen14511-http-effb4761]
permissions:
  contents: read
concurrency:
  group: codex-qwen14511-http-effb4761-${{ github.ref }}
  cancel-in-progress: false
jobs:
  final-head-validation:
    if: github.repository == 'GoldArowana/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      QWEN_PROBE_SOURCE: ${{ github.workspace }}/source
      QWEN_PROBE_SCRATCH: ${{ github.workspace }}/qwen14511-http-effb4761-scratch
      SOURCE_REPOSITORY: GoldArowana/qwen-code
      SOURCE_COMMIT: bd45cd4007a5c545c344fb3a36b3e1a073907eca
      SOURCE_TREE: 3ca90b00bc0448a55f6332047b349ab98ed48fe7
    steps:
      - name: Checkout validation harness
        uses: actions/checkout@v4
        with:
          path: validation
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          repository: GoldArowana/qwen-code
          ref: bd45cd4007a5c545c344fb3a36b3e1a073907eca
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Assert source attribution and clean tracked bytes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test "$(git remote get-url origin)" = "https://github.com/$SOURCE_REPOSITORY"
          git diff HEAD --exit-code
          mkdir -p "$QWEN_PROBE_SCRATCH"
          python3 - <<'PY'
          import json, os, pathlib
          report = {name: os.environ[name] for name in ['SOURCE_REPOSITORY', 'SOURCE_COMMIT', 'SOURCE_TREE', 'GITHUB_SHA', 'GITHUB_REPOSITORY', 'GITHUB_REF']}
          report['meaning'] = 'SOURCE_COMMIT/TREE identify tested upstream bytes; GITHUB_SHA identifies the independent validation harness event.'
          pathlib.Path(os.environ['QWEN_PROBE_SCRATCH'], 'source-attribution.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Set up supported Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up exact pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.24.0'
          run_install: false
      - name: Frozen normal dependency bootstrap including prepare build
        id: bootstrap
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          test "$(pnpm --version)" = '11.24.0'
          node -e "const p=require('./package.json'); if(!p.packageManager.startsWith('pnpm@11.24.0+')) process.exit(1)"
          pnpm install --frozen-lockfile 2>&1 | tee "$QWEN_PROBE_SCRATCH/bootstrap.log"
          git diff HEAD --exit-code
      - name: Prepare independent scratch HTTP test script
        shell: bash
        run: python3 validation/.codex-validation/qwen14511-http-effb4761/prepare-probe.py
      - name: Execute actual HTTP and local journal controls
        id: scratch
        working-directory: source/packages/cli
        shell: bash
        run: |
          set -euo pipefail
          status=0
          npx --no-install vitest run "$QWEN_PROBE_SCRATCH/command-operations.probe.test.ts" --config "$QWEN_PROBE_SCRATCH/probe.config.ts" 2>&1 | tee "$QWEN_PROBE_SCRATCH/http-probe.log" || status=$?
          printf '%s\n' "$status" > "$QWEN_PROBE_SCRATCH/http-probe.exit"
          exit "$status"
      - name: Run committed dedicated command-operation tests
        id: unit
        working-directory: source/packages/cli
        shell: bash
        run: |
          set -euo pipefail
          status=0
          npx --no-install vitest run src/serve/hosted-harness-command-operations.test.ts src/serve/hosted-session-command-session.test.ts 2>&1 | tee "$QWEN_PROBE_SCRATCH/committed-suite.log" || status=$?
          printf '%s\n' "$status" > "$QWEN_PROBE_SCRATCH/committed-suite.exit"
          exit "$status"
      - name: Run normal repository typecheck
        id: typecheck
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          status=0
          npm run typecheck 2>&1 | tee "$QWEN_PROBE_SCRATCH/typecheck.log" || status=$?
          printf '%s\n' "$status" > "$QWEN_PROBE_SCRATCH/typecheck.exit"
          exit "$status"
      - name: Build and bundle the actual candidate CLI
        id: bundle
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          status=0
          (npm run build && npm run bundle) 2>&1 | tee "$QWEN_PROBE_SCRATCH/build-bundle.log" || status=$?
          printf '%s\n' "$status" > "$QWEN_PROBE_SCRATCH/build-bundle.exit"
          git diff HEAD --exit-code
          exit "$status"
      - name: Verify current built CLI through local HTTP transport fixtures
        id: cli
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          status=0
          npx --no-install tsx "$GITHUB_WORKSPACE/validation/.codex-validation/qwen14511-http-effb4761/cli-probe.ts" 2>&1 | tee "$QWEN_PROBE_SCRATCH/cli-probe.log" || status=$?
          printf '%s\n' "$status" > "$QWEN_PROBE_SCRATCH/cli-probe.exit"
          exit "$status"
      - name: Run canonical full preflight without filtering or skips
        if: always() && steps.bootstrap.outcome == 'success' && steps.scratch.outcome == 'success' && steps.unit.outcome == 'success'
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          status=0
          npm run preflight 2>&1 | tee "$QWEN_PROBE_SCRATCH/preflight.log" || status=$?
          printf '%s\n' "$status" > "$QWEN_PROBE_SCRATCH/preflight.exit"
          exit "$status"
      - name: Always verify tested source tracked bytes and attribution
        if: always()
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          git diff HEAD --exit-code 2>&1 | tee "$QWEN_PROBE_SCRATCH/final-source-diff.log"
          printf '0\n' > "$QWEN_PROBE_SCRATCH/final-source-diff.exit"
      - name: Upload bounded test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen14511-http-effb4761-final
          path: |
            ${{ github.workspace }}/qwen14511-http-effb4761-scratch/*.json
            ${{ github.workspace }}/qwen14511-http-effb4761-scratch/*.log
            ${{ github.workspace }}/qwen14511-http-effb4761-scratch/*.exit
            ${{ github.workspace }}/qwen14511-http-effb4761-scratch/*.xml
            ${{ github.workspace }}/qwen14511-http-effb4761-scratch/*.ts
          if-no-files-found: warn
          retention-days: 7
